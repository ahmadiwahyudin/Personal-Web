<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Essays & Academic Perspectives | Wahyudin Ahmadi</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#0ea5e9',
            dark: '#0f172a',
            secondary: '#64748b',
          }
        }
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-sky-500 selection:text-white">

  <!-- Navigasi -->
  <nav class="sticky top-0 z-40 backdrop-blur-md bg-white/85 border-b border-slate-200">
    <div class="max-w-4xl mx-auto px-6 h-16 flex items-center justify-between">
      <a href="./index.html" class="font-bold text-sm text-dark flex items-center gap-2 hover:text-primary transition">
        &larr; Back to Portfolio
      </a>
      <span class="text-xs font-mono font-bold text-slate-700">Ahmadi<span class="text-primary">.lab</span></span>
    </div>
  </nav>

  <!-- Konten Utama: Daftar Tulisan -->
  <main class="max-w-4xl mx-auto px-6 py-16">
    <header class="mb-12">
      <span class="text-xs font-mono uppercase tracking-widest text-primary font-bold">Essays & Perspectives</span>
      <h1 class="text-3xl font-black text-dark mt-1">Linguistic Thoughts & Fieldwork Notes</h1>
      <p class="text-secondary text-sm mt-2">Refleksi akademis, catatan metodologi, dan diskursus serta komputasi.</p>
    </header>

    <!-- Container Daftar Artikel (Otomatis dirender JS) -->
    <div id="articles-container" class="space-y-6"></div>
  </main>

  <!-- MODAL / JENDELA BACA ARTIKEL LENGKAP -->
  <div id="reading-modal" class="fixed inset-0 z-50 hidden bg-slate-950/70 backdrop-blur-xs flex items-center justify-center p-4">
    <div class="bg-white w-full max-w-3xl max-h-[90vh] rounded-3xl shadow-2xl overflow-hidden flex flex-col animate-in fade-in zoom-in duration-200">
      
      <!-- Modal Header -->
      <div class="px-8 py-5 border-b border-slate-100 flex items-center justify-between bg-slate-50">
        <span id="modal-meta" class="text-xs font-mono text-primary font-semibold"></span>
        <button id="close-modal" class="w-8 h-8 rounded-full bg-slate-200 hover:bg-slate-300 text-slate-700 flex items-center justify-center font-bold text-sm transition">
          ✕
        </button>
      </div>

      <!-- Modal Body (Isi Lengkap Artikel) -->
      <div class="p-8 overflow-y-auto space-y-4">
        <h2 id="modal-title" class="text-2xl sm:text-3xl font-black text-dark leading-tight mb-4"></h2>
        <div id="modal-content" class="space-y-4 text-slate-700"></div>
      </div>

      <!-- Modal Footer -->
      <div class="px-8 py-4 border-t border-slate-100 bg-slate-50 text-right">
        <button id="close-modal-bottom" class="px-5 py-2 rounded-xl bg-slate-200 hover:bg-slate-300 text-dark text-xs font-bold transition">
          Close Article
        </button>
      </div>
    </div>
  </div>

  <footer class="py-10 text-center text-xs text-secondary border-t border-slate-200 mt-16 bg-white">
    &copy; 2026 Wahyudin Ahmadi. All rights reserved.
  </footer>

  <!-- Script Data & Reader Logic -->
  <script src="./blog-data.js"></script>
  <script>
    const container = document.getElementById('articles-container');
    const modal = document.getElementById('reading-modal');
    const modalTitle = document.getElementById('modal-title');
    const modalMeta = document.getElementById('modal-meta');
    const modalContent = document.getElementById('modal-content');
    const closeBtn = document.getElementById('close-modal');
    const closeBottomBtn = document.getElementById('close-modal-bottom');

    // 1. Render Kartu Artikel di Daftar
    if (typeof blogArticles !== 'undefined' && container) {
      container.innerHTML = blogArticles.map(article => `
        <article class="p-6 rounded-2xl bg-white border border-slate-200 shadow-xs hover:border-primary transition duration-200">
          <div class="flex items-center gap-3 text-xs font-mono text-secondary mb-2">
            <span class="px-2 py-0.5 rounded bg-sky-50 text-primary font-bold">${article.category}</span>
            <span>${article.date}</span>
            <span>• ${article.readTime}</span>
          </div>
          <h2 class="text-xl font-bold text-dark mb-2">${article.title}</h2>
          <p class="text-sm text-secondary leading-relaxed mb-4">${article.excerpt}</p>
          <button 
            onclick="openArticle('${article.id}')" 
            class="text-xs font-semibold text-primary hover:text-sky-700 transition flex items-center gap-1 font-mono"
          >
            Read Full Article &rarr;
          </button>
        </article>
      `).join('');
    }

    // 2. Fungsi Membuka Modal Baca (Sintaks string sudah diperbaiki)
    window.openArticle = function(id) {
      const article = blogArticles.find(a => a.id === id);
      if (article) {
        modalTitle.innerText = article.title;
        modalMeta.innerText = `${article.category} • ${article.date} • ${article.readTime}`;
        modalContent.innerHTML = article.content;
        modal.classList.remove('hidden');
        document.body.style.overflow = 'hidden';
      }
    };

    // 3. Fungsi Menutup Modal
    function closeModal() {
      modal.classList.add('hidden');
      document.body.style.overflow = 'auto';
    }

    closeBtn.addEventListener('click', closeModal);
    closeBottomBtn.addEventListener('click', closeModal);

    // Tutup jika klik latar belakang gelap atau tombol Escape
    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModal();
    });
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });
  </script>
</body>
</html>
